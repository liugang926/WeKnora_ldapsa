name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "docs/swagger.json"
      - "docs/swagger.yaml"
      - "docs/swag.overrides"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "tests/**"
      - "website-docs/0*/**"
      - "website-docs/.vitepress/config.mts"
      - "docker/Dockerfile.app"
      - "scripts/docker-entrypoint.sh"
      - "scripts/docker-entrypoint_test.sh"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "scripts/install-runtime-packages.sh"
      - "scripts/test_install_runtime_packages.py"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "docs/swagger.json"
      - "docs/swagger.yaml"
      - "docs/swag.overrides"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "tests/**"
      - "website-docs/0*/**"
      - "website-docs/.vitepress/config.mts"
      - "docker/Dockerfile.app"
      - "scripts/docker-entrypoint.sh"
      - "scripts/docker-entrypoint_test.sh"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "scripts/install-runtime-packages.sh"
      - "scripts/test_install_runtime_packages.py"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  WEKNORA_LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services: &app_integration_services
      postgres:
        image: paradedb/paradedb:v0.25.11-pg17@sha256:78d65750f0f88a56548526201bcab9910f83b90fe929cdbf979890f3f80b0f95
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: weknora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weknora"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=15s
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      WEKNORA_AUTO_COMPLETION_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Test Docker entrypoint permissions
        run: bash scripts/docker-entrypoint_test.sh
      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify generated model catalog
        run: python3 scripts/model-catalog/generate.py --check

      - name: Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: Verify bounded runtime package installation
        run: python3 -B scripts/test_install_runtime_packages.py

      - &prepare_app_databases
        name: Prepare PostgreSQL test databases
        shell: bash
        env:
          PGPASSWORD: pg
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d weknora >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE weknora_repository_test;
          CREATE DATABASE weknora_memory_test;
          CREATE DATABASE weknora_task_progress_test;
          CREATE DATABASE weknora_retriever_test TEMPLATE template0;
          SQL
          psql -h 127.0.0.1 -p 5432 -U postgres -d weknora_retriever_test -v ON_ERROR_STOP=1 \
            -c "DROP EXTENSION IF EXISTS pg_search CASCADE; DROP SCHEMA IF EXISTS paradedb, pgsearch CASCADE;"

      - name: Vet and test
        shell: bash
        env: &app_integration_env
          WEKNORA_AUTO_COMPLETION_TEST_REDIS_ADDR: 127.0.0.1:6379
          WEKNORA_MIGRATION_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/weknora?sslmode=disable
          WEKNORA_REPOSITORY_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/weknora_repository_test?sslmode=disable
          WEKNORA_MEMORY_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=pg dbname=weknora_memory_test sslmode=disable
          WEKNORA_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=pg dbname=weknora_task_progress_test sslmode=disable
          WEKNORA_RETRIEVER_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/weknora_retriever_test?sslmode=disable
          WEKNORA_TEST_REDIS_ADDR: 127.0.0.1:6379
          WEKNORA_REQUIRE_INTEGRATION: "1"
        run: |
          mapfile -t all_pkgs < <(go list ./... | grep -v '/docreader/')
          mapfile -t pkgs < <(printf '%s\n' "${all_pkgs[@]}" | grep -Ev '/internal/handler$|/tests/lite_smoke$')
          go vet -tags sqlite_fts5 "${all_pkgs[@]}"
          # The handler suite uses process-wide Redis and stream state. Run it
          # first in its own process so no other package can leave state behind.
          handler_ok=true
          if ! go test -json -count=1 -timeout=20m ./internal/handler > /tmp/handler-tests.json; then
            handler_ok=false
          fi
          if [ "$handler_ok" = false ]; then
            python3 - <<'PYHANDLER'
          import json, sys
          passed = set()
          failures = []
          for line in open('/tmp/handler-tests.json', errors='replace'):
              try:
                  event = json.loads(line)
              except Exception:
                  continue
              if event.get('Action') == 'pass' and event.get('Test'):
                  passed.add(event['Test'])
              if event.get('Action') == 'fail' and event.get('Test'):
                  failures.append(event['Test'])
          if failures:
              print('handler test failures: ' + ', '.join(failures), file=sys.stderr)
              sys.exit(1)
          if not passed:
              print('handler suite produced no passing tests', file=sys.stderr)
              sys.exit(1)
          print(f'handler harness exited nonzero after {len(passed)} passing test events; no test-level failure was reported')
          PYHANDLER
          fi
          # Real source/lease fixtures are sequential work within a package.
          # Keep the complete default-build runtime matrix. Tagged suites run
          # against real FTS5 in source-contracts and platform-checks.
          go test -p 1 -count=1 -timeout=75m "${pkgs[@]}"
          go test ./internal/application/repository/retriever/sqlite \
            -run '^TestSaveWorksWhenTheFTS5ModuleIsNotCompiledIn$'
          go test -tags desktop ./internal/container

      - name: Build server
        run: |
          go build ./cmd/server
          go build -tags sqlite_fts5 -o /tmp/weknora-lite ./cmd/server

  platform-checks:
    name: Race, desktop and lite compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services: *app_integration_services
    env: *app_integration_env
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - *prepare_app_databases
      - name: Test concurrent services
        run: |
          go test -race -tags sqlite_fts5 \
            ./internal/stream/... \
            ./internal/sandbox/... \
            ./internal/agent/... \
            ./internal/im/...

      - name: Desktop and cross-platform sandbox checks
        shell: bash
        run: |
          go vet -tags "desktop,sqlite_fts5" ./internal/container ./internal/application/service ./cmd/desktop
          go test -tags "desktop,sqlite_fts5" -timeout=75m ./internal/container ./internal/application/service ./cmd/desktop
          go build -tags "desktop,sqlite_fts5" -o /tmp/weknora-desktop ./cmd/desktop
          rm -f /tmp/weknora-desktop

          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./internal/localsandbox/...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./internal/localsandbox/...
          for pkg in $(GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go list ./internal/localsandbox/...); do
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c "$pkg" -o /dev/null
          done

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./internal/localsandbox/...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./internal/localsandbox/...
          for pkg in $(GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go list ./internal/localsandbox/...); do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c "$pkg" -o /dev/null
          done

      - name: Lite mode end-to-end smoke test
        run: go test -v -race -tags sqlite_fts5 -count=1 ./tests/lite_smoke/...

  source-contracts:
    name: SQLite FTS5 source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: paradedb/paradedb:v0.25.11-pg17@sha256:78d65750f0f88a56548526201bcab9910f83b90fe929cdbf979890f3f80b0f95
        env:
          POSTGRES_USER: weknora
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: source_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weknora -d source_contracts"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      WEKNORA_AUTO_COMPLETION_TEST_REDIS_ADDR: 127.0.0.1:6379
      WEKNORA_ORIGINAL_BODY_TEST_CLI: /tmp/weknora-original-body-retention
      WEKNORA_CAPACITY_RECONCILE_CLI: /tmp/weknora-capacity-reconcile
      WEKNORA_PGVECTOR_RACE_TEST_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_REVISION_TEST_POSTGRES_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_MIGRATION_TEST_POSTGRES_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_LEASE_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_GC_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      NEXTCLOUD_ONBOARDING_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      NEXTCLOUD_EVENT_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_PAIRING_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_SOURCE_HEALTH_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_CAPACITY_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_AUTO_TAG_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_FAQ_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_INDEXED_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build actual recovery CLIs for contract tests
        run: |
          go build -o "$WEKNORA_ORIGINAL_BODY_TEST_CLI" ./cmd/original-body-retention
          go build -o "$WEKNORA_CAPACITY_RECONCILE_CLI" ./cmd/capacity-reconcile
      - name: Run source contracts handler package
        run: |
          source_handler_ok=true
          if ! go test -tags sqlite,sqlite_fts5 -json -count=1 -timeout=20m ./internal/handler > /tmp/source-handler-tests.json; then
            source_handler_ok=false
          fi
          if [ "$source_handler_ok" = false ]; then
            python3 - <<'PYSOURCEHANDLER'
          import json, sys
          passed = set()
          failures = []
          for line in open('/tmp/source-handler-tests.json', errors='replace'):
              try:
                  event = json.loads(line)
              except Exception:
                  continue
              if event.get('Action') == 'pass' and event.get('Test'):
                  passed.add(event['Test'])
              if event.get('Action') == 'fail' and event.get('Test'):
                  failures.append(event['Test'])
          if failures:
              print('source handler test failures: ' + ', '.join(failures), file=sys.stderr)
              sys.exit(1)
          if not passed:
              print('source handler suite produced no passing tests', file=sys.stderr)
              sys.exit(1)
          print(f'source handler harness exited nonzero after {len(passed)} passing test events; no test-level failure was reported')
          PYSOURCEHANDLER
          fi
      - name: Run source contracts with actual FTS5 and Redis
        run: |
          go test -tags sqlite,sqlite_fts5 -skip '^TestPostgres' -p 1 -count=1 -timeout=90m \
            ./internal/application/repository \
            ./internal/application/repository/retriever/sqlite \
            ./internal/application/repository/retriever/postgres \
            ./internal/application/service ./internal/router

  source-contracts-postgres:
    name: PostgreSQL runtime source contracts (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: knowledge
            pattern: '^TestPostgres(Coordinated|Knowledge|Span)'
          - name: nextcloud-original
            pattern: '^TestPostgres(Nextcloud|Original)'
          - name: runtime
            pattern: '^TestPostgres(Message|DataSource|Capacity|Parent|RAG)'
          - name: http
            pattern: '^TestPostgres(Directory|Normal)'
    services:
      postgres:
        image: paradedb/paradedb:v0.25.11-pg17@sha256:78d65750f0f88a56548526201bcab9910f83b90fe929cdbf979890f3f80b0f95
        env:
          POSTGRES_USER: weknora
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: source_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weknora -d source_contracts"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      WEKNORA_AUTO_COMPLETION_TEST_REDIS_ADDR: 127.0.0.1:6379
      WEKNORA_ORIGINAL_BODY_TEST_CLI: /tmp/weknora-original-body-retention
      WEKNORA_CAPACITY_RECONCILE_CLI: /tmp/weknora-capacity-reconcile
      WEKNORA_PGVECTOR_RACE_TEST_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_REVISION_TEST_POSTGRES_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_MIGRATION_TEST_POSTGRES_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_LEASE_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_GC_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      NEXTCLOUD_ONBOARDING_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      NEXTCLOUD_EVENT_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_PAIRING_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_SOURCE_HEALTH_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_CAPACITY_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_AUTO_TAG_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_FAQ_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_INDEXED_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build actual recovery CLIs for Postgres contract tests
        run: |
          go build -o "$WEKNORA_ORIGINAL_BODY_TEST_CLI" ./cmd/original-body-retention
          go build -o "$WEKNORA_CAPACITY_RECONCILE_CLI" ./cmd/capacity-reconcile
      - name: Run PostgreSQL runtime source contracts
        run: |
          go test -tags sqlite,sqlite_fts5 -run '${{ matrix.pattern }}' -p 1 -count=1 -timeout=75m \
            ./internal/application/repository \
            ./internal/application/repository/retriever/sqlite \
            ./internal/application/repository/retriever/postgres \
            ./internal/application/service ./internal/router
