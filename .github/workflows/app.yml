name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "scripts/install-runtime-packages.sh"
      - "scripts/test_install_runtime_packages.py"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "scripts/install-runtime-packages.sh"
      - "scripts/test_install_runtime_packages.py"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      WEKNORA_AUTO_COMPLETION_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: Verify bounded runtime package installation
        run: python3 -B scripts/test_install_runtime_packages.py

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          # Real source/lease fixtures are sequential work within a package.
          # The service package carries the complete no-tag runtime matrix.
          go test -timeout=75m "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server

  source-contracts:
    name: SQLite FTS5 and PostgreSQL source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: paradedb/paradedb:v0.22.6-pg17@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
        env:
          POSTGRES_USER: weknora
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: source_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weknora -d source_contracts"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      WEKNORA_AUTO_COMPLETION_TEST_REDIS_ADDR: 127.0.0.1:6379
      WEKNORA_ORIGINAL_BODY_TEST_CLI: /tmp/weknora-original-body-retention
      WEKNORA_CAPACITY_RECONCILE_CLI: /tmp/weknora-capacity-reconcile
      WEKNORA_PGVECTOR_RACE_TEST_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_REVISION_TEST_POSTGRES_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_MIGRATION_TEST_POSTGRES_DSN: postgres://weknora:fixture-only@localhost:5432/source_contracts?sslmode=disable
      WEKNORA_LEASE_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_GC_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      NEXTCLOUD_ONBOARDING_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      NEXTCLOUD_EVENT_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_PAIRING_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_SOURCE_HEALTH_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_CAPACITY_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_AUTO_TAG_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_FAQ_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
      WEKNORA_INDEXED_TEST_POSTGRES_DSN: host=localhost port=5432 user=weknora password=fixture-only dbname=source_contracts sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build actual recovery CLIs for contract tests
        run: |
          go build -o "$WEKNORA_ORIGINAL_BODY_TEST_CLI" ./cmd/original-body-retention
          go build -o "$WEKNORA_CAPACITY_RECONCILE_CLI" ./cmd/capacity-reconcile
      - name: Run source contracts with actual FTS5, PostgreSQL and Redis
        run: |
          go test -tags sqlite,sqlite_fts5 -p 1 -count=1 -timeout=75m \
            ./internal/application/repository \
            ./internal/application/repository/retriever/sqlite \
            ./internal/application/repository/retriever/postgres \
            ./internal/application/service ./internal/handler ./internal/router
