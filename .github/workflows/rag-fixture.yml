name: RAG Synthetic Fixture

on:
  push:
    branches: [main]
    paths:
      - "dataset/benchmarks/**"
      - "scripts/local-rag-models/**"
      - ".github/workflows/rag-fixture.yml"
  pull_request:
    paths:
      - "dataset/benchmarks/**"
      - "scripts/local-rag-models/**"
      - ".github/workflows/rag-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fixture dependencies
        run: python -m pip install -r scripts/local-rag-models/requirements-fixture.txt
      - name: Validate manifests, nested groups, and committed Parquet
        run: python -m unittest discover -s scripts/local-rag-models -p 'test_*.py'
