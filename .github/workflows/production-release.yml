name: Production release
on:
  push:
    tags: ['prod-*']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  main-ci-gate:
    name: Exact merged main CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test the exact-main Actions gate offline
        run: python3 -m unittest discover -s .github/scripts -p 'test_require_main_ci.py' -v
      - name: Require the production tag at the current main tip
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/prod-* ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          candidate=$(git rev-parse 'HEAD^{commit}')
          main_tip=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          [[ "$candidate" == "$GITHUB_SHA" && "$candidate" == "$main_tip" ]]
      - name: Wait for exact merged-main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/require_main_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --timeout-seconds 4500 \
            --poll-seconds 15 \
            --settle-seconds 60
      - name: Recheck the main tip after CI discovery
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          candidate=$(git rev-parse 'HEAD^{commit}')
          main_tip=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          [[ "$candidate" == "$GITHUB_SHA" && "$candidate" == "$main_tip" ]]

  package:
    needs: main-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Recheck the exact merged main tip and deployment helpers
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/prod-* ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          candidate=$(git rev-parse 'HEAD^{commit}')
          main_tip=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          [[ "$candidate" == "$GITHUB_SHA" && "$candidate" == "$main_tip" ]]
          bash -n deploy/production/*.sh
          python3 -m unittest discover -s deploy/production -p 'test_*.py'
      - uses: docker/setup-buildx-action@v4
      - name: Build application
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          load: true
          tags: weknora-production-app:${{ github.sha }}
          build-args: |
            WITH_ANYDOC=1
            COMMIT_ID_ARG=${{ github.sha }}
          cache-from: |
            type=gha,scope=production-app-amd64
            type=gha,scope=app-image-pr-amd64
          cache-to: type=gha,scope=production-app-amd64,mode=min
      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          tags: weknora-production-ui:${{ github.sha }}
          build-args: VITE_FRONTEND_COMMIT=${{ github.sha }}
      - name: Verify and package immutable images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker image inspect "weknora-production-app:$GITHUB_SHA" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "WEKNORA_BUILD_COMMIT=$GITHUB_SHA"
          docker run --rm --entrypoint sh "weknora-production-app:$GITHUB_SHA" -c 'test -x /app/WeKnora && test -x /usr/local/bin/migrate && test -x /usr/local/bin/original-body-retention && test -x /usr/local/bin/publication-recovery'
          docker pull paradedb/paradedb:v0.22.6-pg17@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
          docker tag paradedb/paradedb:v0.22.6-pg17@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2 paradedb/paradedb:v0.22.6-pg17
          docker pull redis:7.4.10-alpine
          mkdir bundle
          python3 deploy/production/make_manifest.py > bundle/manifest.json
          docker save "weknora-production-app:$GITHUB_SHA" "weknora-production-ui:$GITHUB_SHA" paradedb/paradedb:v0.22.6-pg17 redis:7.4.10-alpine | gzip -1 | split -b 1800M -d - bundle/images.tar.gz.part
          tar --exclude=__pycache__ -czf bundle/deployment.tar.gz -C deploy production
          (cd bundle && sha256sum manifest.json deployment.tar.gz images.tar.gz.part* > SHA256SUMS)
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          candidate=$(git rev-parse 'HEAD^{commit}')
          main_tip=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          [[ "$candidate" == "$GITHUB_SHA" && "$candidate" == "$main_tip" ]]
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "WeKnora production $GITHUB_REF_NAME" --notes "Merged main commit: $GITHUB_SHA. Linux amd64. Deployment includes bounded resources, backup and health gates." --draft
          gh release upload "$GITHUB_REF_NAME" bundle/*
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          candidate=$(git rev-parse 'HEAD^{commit}')
          main_tip=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          [[ "$candidate" == "$GITHUB_SHA" && "$candidate" == "$main_tip" ]]
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
