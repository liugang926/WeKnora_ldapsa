name: App image PR

on:
  pull_request:
    paths:
      - ".github/workflows/app-image-pr.yml"
      - "docker/Dockerfile.app"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "cmd/server/**"
      - "internal/application/**"
      - "internal/models/**"
      - "internal/container/**"
      - "internal/database/**"
      - "config/**"
      - "migrations/**"
      - "scripts/build-anydoc-lib.sh"
      - "scripts/build_browserskill.sh"
      - "third_party/anydoc-go/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Full AnyDoc app image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          push: false
          load: true
          tags: weknora-app:pr-check
          build-args: |
            WITH_ANYDOC=1
            COMMIT_ID_ARG=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=app-image-pr-amd64
          cache-to: type=gha,scope=app-image-pr-amd64,mode=min

      - name: Verify runtime image and revision
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker image inspect weknora-app:pr-check \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fx "WEKNORA_BUILD_COMMIT=$EXPECTED_COMMIT"
          docker run --rm --entrypoint /bin/sh weknora-app:pr-check \
            -c 'test -x /app/WeKnora && test -x /usr/local/bin/migrate && test -d /app/migrations'
